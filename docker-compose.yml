# Local stack. SQLite and the in-process cache are the defaults, so this is just
# the API plus a mounted volume for the database and model artifacts.
#
# Postgres and Redis profiles are available for exercising those code paths, but
# they are opt-in because neither is needed to run the project:
#   docker compose --profile postgres --profile redis up
#
# The postgres profile is how the production database split is rehearsed locally.
# Start it, then point the API's user database at it while the catalogue stays on
# the mounted SQLite file -- the same arrangement as Render plus Supabase:
#   docker compose --profile postgres up -d postgres
#   DATABASE_URL=postgresql://movico_user:movico_pass@postgres:5432/movico_db \
#     docker compose up api

services:
  api:
    build: .
    container_name: movico_api
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      TMDB_API_KEY: ${TMDB_API_KEY:?set TMDB_API_KEY in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Blank keeps accounts in the same SQLite file as the catalogue. Set it to
      # the postgres service above to rehearse the production split.
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_ENABLED: "false"
      DATA_DIR: /workspace/data
      MODELS_DIR: /workspace/models_checkpoint
    volumes:
      # The dataset and artifacts are large and slow to rebuild, so they live
      # outside the container.
      - ./data:/workspace/data
      - ./models_checkpoint:/workspace/models_checkpoint
      - ./logs:/workspace/logs

  postgres:
    image: postgres:16-alpine
    container_name: movico_postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: movico_user
      POSTGRES_PASSWORD: movico_pass
      POSTGRES_DB: movico_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movico_user -d movico_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: movico_redis
    profiles: ["redis"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
