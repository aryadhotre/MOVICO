<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0908" />

    <title>MOVICO — Film recommendations that explain themselves</title>
    <meta
      name="description"
      content="A hybrid movie recommender trained on 33 million ratings. Rate ten films and MOVICO finds what's worth your evening — and tells you why it picked each one."
    />

    <!-- Open Graph, so a shared link renders as a card rather than a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MOVICO — Film recommendations that explain themselves" />
    <meta
      property="og:description"
      content="A hybrid movie recommender trained on 33 million ratings, with explained picks and controls for diversity and novelty."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Warming the TMDB image origin: every poster on the page comes from it, so
         paying the DNS and TLS handshake up front removes it from the critical path
         of the first image. -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%277%27%20fill%3D%27%230A0908%27%2F%3E%3Cg%20fill%3D%27%2338312B%27%3E%3Crect%20x%3D%272.5%27%20y%3D%276%27%20width%3D%273%27%20height%3D%275%27%20rx%3D%271%27%2F%3E%3Crect%20x%3D%272.5%27%20y%3D%2721%27%20width%3D%273%27%20height%3D%275%27%20rx%3D%271%27%2F%3E%3Crect%20x%3D%2726.5%27%20y%3D%276%27%20width%3D%273%27%20height%3D%275%27%20rx%3D%271%27%2F%3E%3Crect%20x%3D%2726.5%27%20y%3D%2721%27%20width%3D%273%27%20height%3D%275%27%20rx%3D%271%27%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%278.5%27%20fill%3D%27%23A96812%27%20opacity%3D%27.35%27%2F%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%275.5%27%20fill%3D%27%23EDA32C%27%2F%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%272.2%27%20fill%3D%27%23FBE3B8%27%2F%3E%3C%2Fsvg%3E"
